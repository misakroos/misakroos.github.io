<style>
.slider { overflow:hidden; border-radius:20px; }
.slides { display:flex; transition:0.6s ease; }
.slide {
  min-width:100%;
  height:380px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  text-align:center;
  background: radial-gradient(circle at top, #111, #000);
}

.logo {
  height:60px;
  margin-bottom:15px;
  filter: drop-shadow(0 0 10px rgba(255,255,255,0.2));
}

.title {
  font-size:28px;
  font-weight:700;
  margin-bottom:10px;
}

.prices {
  display:flex;
  gap:15px;
  margin-top:15px;
}

.btn {
  padding:12px 20px;
  border-radius:12px;
  font-weight:600;
  background:rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
}

.netflix { color:#e50914; }
.disney { color:#00A8E1; }
.prime { color:#00A8E1; }
.paramount { color:#0d6efd; }

.nav {
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:30px;
  cursor:pointer;
  padding:10px;
}
.prev { left:10px; }
.next { right:10px; }
</style>

<div class="slider">
  <div class="slides" id="slides">

    <!-- NETFLIX -->
    <div class="slide">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/0/08/Netflix_2015_logo.svg">
      <div class="title netflix">Netflix</div>
      <div class="prices" id="netflixPrices"></div>
    </div>

    <!-- DISNEY -->
    <div class="slide">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/1/1e/Disney%2B_logo.svg">
      <div class="title disney">Disney+</div>
      <div class="prices" id="disneyPrices"></div>
    </div>

    <!-- PRIME -->
    <div class="slide">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/8/8c/Prime_Video_logo_%282024%29.svg">
      <div class="title prime">Prime Video</div>
      <div class="prices" id="primePrices"></div>
    </div>

    <!-- PARAMOUNT -->
    <div class="slide">
      <img class="logo" src="https://upload.wikimedia.org/wikipedia/commons/4/4f/Paramount%2B_Logo.svg">
      <div class="title paramount">Paramount+</div>
      <div class="prices" id="paramountPrices"></div>
    </div>

  </div>

  <div class="nav prev" onclick="move(-1)">‹</div>
  <div class="nav next" onclick="move(1)">›</div>
</div>

<script>
let country = localStorage.getItem("country") || "AR";

const prices = {
  netflix: { AR:[7500,12900], UY:[250,450] },
  disney: { AR:[6500,12000], UY:[300,250] },
  prime: { AR:[4500,8000], UY:[150,280] },
  paramount: { AR:[4500,8000], UY:[150,280] }
};

function renderPrices(){
  document.getElementById("netflixPrices").innerHTML =
    `<div class="btn">1 pantalla $${prices.netflix[country][0]}</div>
     <div class="btn">2 pantallas $${prices.netflix[country][1]}</div>`;

  document.getElementById("disneyPrices").innerHTML =
    `<div class="btn">1 pantalla $${prices.disney[country][0]}</div>
     <div class="btn">2 pantallas $${prices.disney[country][1]}</div>`;

  document.getElementById("primePrices").innerHTML =
    `<div class="btn">1 pantalla $${prices.prime[country][0]}</div>
     <div class="btn">2 pantallas $${prices.prime[country][1]}</div>`;

  document.getElementById("paramountPrices").innerHTML =
    `<div class="btn">1 pantalla $${prices.paramount[country][0]}</div>
     <div class="btn">2 pantallas $${prices.paramount[country][1]}</div>`;
}

renderPrices();

// SLIDER
let i = 0;
const slides = document.getElementById("slides");

function move(dir){
  i = (i + dir + 4) % 4;
  slides.style.transform = `translateX(-${i*100}%)`;
}

setInterval(()=>move(1), 4000);
</script>
