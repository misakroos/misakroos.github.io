<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misakroos - Euphoria</title>
    <style>
        body {
            margin: 0;
            background-color: #141414;
            color: white;
            font-family: Arial, sans-serif;
        }
        .hero {
            background-image: url('https://files.fm/u/xfhb682jzs');
            height: 100vh;
            background-size: cover;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }
        .banner {
            background-color: rgba(0, 0, 0, 0.6);
            padding: 20px;
            border-radius: 10px;
        }
        .marquee {
            background-color: #e50914;
            color: white;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
        }
        .marquee-text {
            display: inline-block;
            padding-left: 100%;
            animation: marquee 15s linear infinite;
        }
        @keyframes marquee {
            0% { transform: translate(0); }
            100% { transform: translate(-100%); }
        }
    </style>
</head>
<body>
    <div class="hero">
        <div class="banner">
            <h1>Bienvenidos a Euphoria</h1>
            <p>La serie más emocionante de todos los tiempos</p>
        </div>
    </div>
    <div class="marquee">
        <div class="marquee-text">🎬 Todos los domingos nuevos episodios de Euphoria por HBO MAX</div>
    </div>
</body>
</html>
