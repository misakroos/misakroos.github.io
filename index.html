<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>MISAKROOS • Premium</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --orange: #FF5C00; --yellow: #FFD200; --pink: #FF3CAC;
  --bg: #0B0B11; --bg2: #13131C; --card: #18181F;
  --border: rgba(255,255,255,0.08); --text: #F2F2F7; --text2: #A0A0B0;
  --ticker-bg: #000; --header-bg: rgba(11,11,17,0.85);
}
[data-theme="light"] {
  --bg: #F4F6FF; --bg2: #FFFFFF; --card: #FFFFFF;
  --border: rgba(0,0,0,0.06); --text: #14142A; --text2: #50507A;
  --ticker-bg: #14142A; --header-bg: rgba(244,246,255,0.85);
}

*,*::before,*::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
body { font-family: 'DM Sans', sans-serif; background: var(--bg); color: var(--text); line-height: 1.4; overflow-x: hidden; }

/* ══ MOBILE OPTIMIZED LAYOUT ══ */
.container { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 16px; }

/* ══ TICKER ══ */
.ticker-wrap { position: fixed; top: 0; width: 100%; height: 28px; background: var(--ticker-bg); z-index: 1001; display: flex; align-items: center; border-bottom: 1px solid rgba(255,92,0,0.2); }
.ticker-track { display: flex; animation: tick 30s linear infinite; white-space: nowrap; }
.ticker-track span { font-size: 10px; font-weight: 700; color: #fff; padding-right: 50px; text-transform: uppercase; letter-spacing: 1px; }
@keyframes tick { from { transform: translateX(0) } to { transform: translateX(-50%) } }

/* ══ HEADER ══ */
header { position: fixed; top: 28px; left: 0; right: 0; z-index: 1000; padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; background: var(--header-bg); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); }
.logo { font-family: 'Syne', sans-serif; font-weight: 800; font-size: 16px; display: flex; align-items: center; gap: 6px; }
.logo-mark { width: 28px; height: 28px; background: linear-gradient(135deg, var(--orange), var(--pink)); border-radius: 6px; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 14px; }

/* ══ HERO ══ */
.hero { padding: 110px 0 20px; text-align: center; }
.hero-title { font-family: 'Syne', sans-serif; font-size: 42px; line-height: 0.9; margin-bottom: 15px; }
.go { background: linear-gradient(90deg, var(--orange), var(--yellow)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

/* ══ COUNTRY TOGGLE (Pill style) ══ */
.ctry-grp { display: grid; grid-template-columns: 1fr 1fr; background: var(--bg2); padding: 4px; border-radius: 12px; margin: 20px 0; border: 1px solid var(--border); }
.ctry-btn { border: none; padding: 10px; border-radius: 9px; background: transparent; color: var(--text2); font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.3s; }
.ctry-btn.active { background: var(--card); color: var(--orange); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

/* ══ WHATSAPP TESTIMONIALS (Compact) ══ */
.wa-phone { background: var(--bg2); border-radius: 18px; border: 1px solid var(--border); overflow: hidden; margin-bottom: 30px; }
.wa-top { background: #075E54; padding: 8px 12px; color: #fff; display: flex; align-items: center; gap: 10px; font-size: 13px; }
.wa-av { width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-weight: 800; border: 1px solid rgba(255,255,255,0.2); }
.wa-body { padding: 15px; height: 100px; position: relative; }
.bubble { background: var(--card); border: 1px solid var(--border); padding: 10px 12px; border-radius: 0 15px 15px 15px; font-size: 13px; max-width: 90%; }

/* ══ GRID & CARDS ══ */
.cat-grid { display: grid; grid-template-columns: 1fr; gap: 12px; padding-bottom: 160px; }
.service-card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px; }
.service-header { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; font-weight: 700; }
.opt-btn { width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--bg2); color: var(--text); cursor: pointer; margin-top: 6px; font-size: 14px; transition: 0.2s; }
.opt-btn.sel { border-color: var(--orange); background: rgba(255,92,0,0.05); border-width: 2px; }

/* ══ FLOATING SUMMARY ══ */
#summary-bar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 2000; padding: 16px; transform: translateY(100%); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
#summary-bar.visible { transform: translateY(0); }
.sum-inner { background: var(--card); border: 1px solid var(--orange); border-radius: 20px; padding: 16px; box-shadow: 0 -10px 30px rgba(0,0,0,0.3); border-bottom: 4px solid var(--orange); }
.wa-btn { background: #25D366; color: #fff; border: none; padding: 16px; border-radius: 12px; font-weight: 800; cursor: pointer; width: 100%; margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 16px; }

/* ══ PC ADAPTATION ══ */
@media (min-width: 768px) {
  .container { max-width: 1000px; }
  .cat-grid { grid-template-columns: repeat(3, 1fr); }
  .hero-title { font-size: 64px; }
  #summary-bar { left: auto; right: 20px; width: 350px; bottom: 20px; }
}
</style>
</head>
<body>

<div class="ticker-wrap"><div class="ticker-track" id="ticker"></div></div>

<header>
  <div class="logo"><div class="logo-mark">M</div> MISAKROOS</div>
  <div style="display:flex; gap:12px;">
    <button style="background:none; border:none; font-size:20px;" onclick="toggleTheme()">🌓</button>
    <a href="https://wa.me/5492645182955" style="text-decoration:none; font-size:20px;">💬</a>
  </div>
</header>

<div class="container">
  <section class="hero">
    <div style="font-size:11px; font-weight:700; opacity:0.6; margin-bottom:8px; letter-spacing:1px;">★ ★ ★ ★ ★ +150 CLIENTES</div>
    <h1 class="hero-title">PREMIUM<br><span class="go">SUBS</span></h1>
    
    <div class="ctry-grp">
      <button class="ctry-btn active" id="btn-AR" onclick="setCountry('AR')">🇦🇷 ARGENTINA</button>
      <button class="ctry-btn" id="btn-UY" onclick="setCountry('UY')">🇺🇾 URUGUAY</button>
    </div>
  </section>

  <section class="wa-phone">
    <div class="wa-top" id="wa-header"></div>
    <div class="wa-body" id="wa-body"></div>
  </section>

  <div class="cat-grid" id="servicios"></div>
</div>

<div id="summary-bar">
  <div class="sum-inner">
    <div id="selected-list" style="max-height: 80px; overflow-y: auto;"></div>
    <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
      <span style="font-weight:800; font-size:22px;" id="total-amount" class="go">$0</span>
      <button class="wa-btn" onclick="enviarWhatsApp()">Pedir ahora</button>
    </div>
  </div>
</div>

<script>
const services = [
  {name:'Netflix', emoji:'🎥', ar:{1:7500,2:12900}, uy:{1:250,2:450}},
  {name:'Disney+', emoji:'🏰', ar:{1:6500,2:12000}, uy:{1:300,2:550}},
  {name:'Max', emoji:'🌀', ar:{1:4500,2:8000}, uy:{1:150,2:280}},
  {name:'YouTube', emoji:'📺', ar:{1:4500}, uy:{1:190}},
  {name:'Spotify', emoji:'🎵', ar:{1:4500}, uy:{1:190}},
  {name:'ChatGPT+', emoji:'🤖', ar:{1:8000}, uy:{1:400}},
  {name:'Canva Pro', emoji:'🎨', ar:{1:5500}, uy:{1:220}}
];

const refs = [
  {n: "Marcos G.", l: "Rosario", t: "Atención impecable. Disney activado en un toque! 🔥"},
  {n: "Sofía R.", l: "Montevideo", t: "Segunda vez que renuevo. Súper confiables."},
  {n: "Juan I.", l: "Córdoba", t: "El mejor precio de Netflix. Muy recomendado."},
  {n: "Vale L.", l: "Punta del Este", t: "Soporte excelente, me ayudaron con la TV rápido."}
];

let country = 'AR', selected = {}, refIdx = 0;

function setCountry(c) {
  country = c; selected = {};
  document.querySelectorAll('.ctry-btn').forEach(b => b.classList.toggle('active', b.id === `btn-${c}`));
  render(); updateSummary();
}

function toggleService(name, qty) {
  if (selected[name] === qty) delete selected[name];
  else selected[name] = qty;
  render(); updateSummary();
}

function render() {
  const grid = document.getElementById('servicios');
  grid.innerHTML = services.map(s => {
    const prices = country === 'AR' ? s.ar : s.uy;
    const btns = Object.keys(prices).map(qty => `
      <button class="opt-btn ${selected[s.name]==qty?'sel':''}" onclick="toggleService('${s.name}',${qty})">
        <span>${qty} Pantalla${qty>1?'s':''}</span>
        <strong>$${prices[qty].toLocaleString()}</strong>
      </button>`).join('');
    return `<div class="service-card"><div class="service-header">${s.emoji} ${s.name}</div>${btns}</div>`;
  }).join('');
}

function updateSummary() {
  const bar = document.getElementById('summary-bar'), list = document.getElementById('selected-list');
  const keys = Object.keys(selected);
  if (keys.length === 0) { bar.classList.remove('visible'); return; }
  let total = 0;
  list.innerHTML = keys.map(k => {
    const s = services.find(x=>x.name===k);
    const p = (country === 'AR' ? s.ar : s.uy)[selected[k]];
    total += p;
    return `<div style="font-size:12px; display:flex; justify-content:space-between;"><span>${k}</span><b>$${p.toLocaleString()}</b></div>`;
  }).join('');
  document.getElementById('total-amount').textContent = `$${total.toLocaleString()}`;
  bar.classList.add('visible');
}

function cycleRefs() {
  const h = document.getElementById('wa-header'), b = document.getElementById('wa-body'), r = refs[refIdx];
  h.innerHTML = `<div class="wa-av" style="background:hsl(${refIdx*60},70%,45%)">${r.n[0]}</div><div><strong>${r.n}</strong> • <span style="opacity:0.7">${r.l}</span></div>`;
  b.innerHTML = `<div class="bubble">${r.t}</div>`;
  refIdx = (refIdx + 1) % refs.length;
}

function toggleTheme() {
  const h = document.documentElement;
  h.setAttribute('data-theme', h.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
}

function enviarWhatsApp() {
  let msg = "¡Hola! Quiero contratar:\n";
  Object.keys(selected).forEach(k => msg += `- ${k} (${selected[k]}P)\n`);
  msg += `\nPaís: ${country}\nTotal: ${document.getElementById('total-amount').textContent}`;
  window.open(`https://wa.me/5492645182955?text=${encodeURIComponent(msg)}`);
}

const ticker = document.getElementById('ticker');
const txt = " ⚡ ACTIVACIÓN INMEDIATA • GARANTÍA TOTAL • SOPORTE 24/7 • ";
ticker.innerHTML = `<span>${txt.repeat(10)}</span><span>${txt.repeat(10)}</span>`;

setInterval(cycleRefs, 4000);
cycleRefs(); render();
</script>
</body>
</html>
